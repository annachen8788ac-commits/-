<style>
:root{--gold:#ffd983;--violet:#8e62ff;--ink:#08080d;--red:#b81624}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050507;color:#fff;font-family:"Noto Serif SC","Songti SC",serif;overflow:hidden}
body{display:grid;place-items:center}.stage{position:relative;width:min(100vw,56.25vh);height:min(177.78vw,100vh);aspect-ratio:9/16;background:#090910;overflow:hidden;box-shadow:0 0 100px #000}
.bg,.shade,.rain,.vfx,.grain,.flash{position:absolute;inset:0}.bg{background:radial-gradient(circle at 52% 32%,#493645 0 16%,transparent 40%),linear-gradient(180deg,#14111f,#181015 45%,#09090c);transform:scale(1.08);transition:filter 1s,transform 5s;background-size:cover;background-position:center}.shade{background:linear-gradient(180deg,rgba(0,0,0,.15),transparent 25%,transparent 60%,rgba(0,0,0,.85)),radial-gradient(circle at center,transparent 35%,rgba(0,0,0,.68))}.grain{opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");mix-blend-mode:soft-light;animation:grain .25s steps(2) infinite}@keyframes grain{50%{transform:translate(2%,-2%)}}
.rain{opacity:0;background:repeating-linear-gradient(100deg,transparent 0 18px,rgba(220,230,255,.22) 19px,transparent 20px);background-size:130% 130%;animation:rain .34s linear infinite}@keyframes rain{to{transform:translate(-18%,28%)}}
.vfx:before,.vfx:after{content:"";position:absolute;border-radius:50%;filter:blur(18px);opacity:0}.vfx:before{width:55%;aspect-ratio:1;left:22%;top:21%;background:conic-gradient(from 20deg,transparent,var(--violet),transparent,var(--gold),transparent);animation:spin 5s linear infinite}.vfx:after{width:80%;height:16%;left:10%;top:45%;background:radial-gradient(ellipse,var(--gold),transparent 65%)}@keyframes spin{to{transform:rotate(360deg)}}
.flash{opacity:0;background:#fff;pointer-events:none}.top{position:absolute;top:5.5%;left:7%;right:7%;text-align:center;text-shadow:0 3px 18px #000}.kicker{font:600 11px/1.2 system-ui;letter-spacing:.28em;color:#ead7a2}.title{font-size:clamp(25px,6.8vw,42px);font-weight:800;line-height:1.07;margin-top:8px;color:#f5dfaa}.ep{margin-top:7px;font:600 12px system-ui;color:#ddd;letter-spacing:.18em}
.actor{position:absolute;left:8%;right:8%;top:26%;height:44%;display:flex;align-items:center;justify-content:center;transition:all .7s cubic-bezier(.2,.7,.2,1)}.silhouette{position:relative;width:72%;height:100%;filter:drop-shadow(0 16px 30px #000)}.head{position:absolute;width:38%;aspect-ratio:.78;left:31%;top:1%;border-radius:46% 46% 42% 42%;background:linear-gradient(150deg,#ead1bc,#b77a6d 65%,#5c3034);box-shadow:inset -14px -6px 25px rgba(45,0,15,.42)}.hair{position:absolute;left:21%;top:-4%;width:58%;height:42%;border-radius:48% 48% 35% 35%;background:radial-gradient(circle at 52% 30%,#30252a,#08070a 70%)}.body{position:absolute;left:8%;right:8%;bottom:0;height:68%;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);background:linear-gradient(110deg,#16141d,#332537 45%,#101015)}.blood{position:absolute;left:27%;top:38%;width:48%;height:3px;background:#ad1321;box-shadow:15px 14px 0 #7f0c16,-10px 30px 0 #7a0b13;opacity:0}.sigil{position:absolute;left:26%;top:21%;width:48%;aspect-ratio:1;border:1px solid rgba(255,221,137,.75);border-radius:50%;opacity:0;box-shadow:0 0 28px #ffcc6a;animation:spin 7s linear infinite}.sigil:before,.sigil:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:#ffe5a3;font-size:55px;text-shadow:0 0 16px #ffcf5e}.sigil:after{content:"☯";font-size:31px;transform:rotate(90deg)}
.caption{position:absolute;left:7%;right:7%;bottom:13%;text-align:center;min-height:90px;display:grid;align-content:end;text-shadow:0 2px 10px #000}.speaker{font:700 12px system-ui;color:var(--gold);letter-spacing:.14em;margin-bottom:8px}.line{font-size:clamp(20px,5.2vw,31px);font-weight:800;line-height:1.35}.sub{margin-top:7px;font:400 12px/1.5 system-ui;color:#d1d1d8}.controls{position:absolute;left:7%;right:7%;bottom:4.5%;display:flex;gap:10px;align-items:center}.btn{appearance:none;border:1px solid rgba(255,255,255,.25);background:rgba(10,10,15,.72);color:#fff;border-radius:999px;padding:10px 16px;font:700 12px system-ui;backdrop-filter:blur(8px);cursor:pointer}.btn.main{background:linear-gradient(90deg,#6d4ae7,#aa7734);border:0;flex:1}.time{font:600 11px system-ui;color:#c9c9cf;min-width:55px;text-align:right}.bar{position:absolute;left:7%;right:7%;bottom:2.4%;height:3px;background:#ffffff22;border-radius:4px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--gold))}.hint{position:absolute;left:0;right:0;top:73%;text-align:center;font:600 11px system-ui;color:#ffffff66}
.stage.scene-death .rain{opacity:.7}.stage.scene-death .blood{opacity:1}.stage.scene-death .bg{filter:saturate(.45) contrast(1.18)}
.stage.scene-rebirth .sigil,.stage.scene-rebirth .vfx:before,.stage.scene-rebirth .vfx:after{opacity:1}.stage.scene-rebirth .bg{filter:saturate(1.3) brightness(1.2)}
.stage.scene-prince .head{background:linear-gradient(150deg,#eee0d7,#b99b9b 60%,#55424b)}.stage.scene-prince .body{background:linear-gradient(120deg,#090910,#21182f 45%,#08090c)}.stage.scene-prince .hair{height:52%}.stage.scene-prince .vfx:before{opacity:.78}.stage.scene-prince .sigil{opacity:.45;border-color:#9a7cff;box-shadow:0 0 30px #623cff}
.stage.scene-curse .sigil{opacity:1}.stage.scene-curse .vfx:before{opacity:1}.stage.scene-curse .actor{transform:scale(1.07)}

</style>

<body>
<main class="stage" id="stage">
  <div class="bg"></div><div class="rain"></div><div class="vfx"></div><div class="shade"></div><div class="grain"></div><div class="flash" id="flash"></div>
  <header class="top"><div class="kicker">AI 真人短剧 · CINEMATIC CUT</div><div class="title">皇叔借点功德<br>王妃把符画猛了</div><div class="ep">第一集 · 助我重生</div></header>
  <section class="actor"><div class="silhouette"><div class="body"></div><div class="hair"></div><div class="head"></div><div class="blood"></div><div class="sigil"></div></div></section>
  <div class="caption"><div class="speaker" id="speaker">点击播放</div><div class="line" id="line">第一集 · 助我重生</div><div class="sub" id="sub">网页自动剪辑版 · 无需手动切镜头</div></div>
  <div class="hint" id="hint">建议开启声音 · 浏览器会使用系统语音演绎对白</div>
  <div class="controls"><button class="btn" id="restart">↺</button><button class="btn main" id="play">▶ 播放第一集</button><div class="time" id="time">00:00</div></div><div class="bar"><div class="fill" id="fill"></div></div>
</main>
<script>
const scenes=[
{d:8,c:'scene-death',sp:'旁白',t:'京城暮雨。她被人追杀到绝路。',s:'雨落青石，脚步声越来越近。',v:'一名少女踉跄逃出长巷。'},
{d:8,c:'scene-death',sp:'家奴',t:'别让她跑了！',s:'石块破空，鲜血落地。',v:'追兵逼近，她倒在晋王车驾之前。'},
{d:9,c:'scene-rebirth',sp:'陆昭菱 · 内心',t:'我……没死？',s:'死亡瞬间，一道紫金帝气贯穿黑暗。',v:'金色符文从虚空聚拢，灵魂重新坠入身体。'},
{d:8,c:'scene-prince',sp:'周时阅',t:'谁准你进来的？',s:'晋王扣住她的脖颈，眸色冷得像冰。',v:'马车内，男人黑袍墨发，气场压迫。'},
{d:9,c:'scene-prince',sp:'陆昭菱 · 内心',t:'帝星紫气……还有死气。',s:'紫气如龙，黑雾却正在蚕食他的命。',v:'她第一次看清周时阅身后的异常气运。'},
{d:9,c:'scene-curse',sp:'陆昭菱',t:'放开我。因为——我能保你的命。',s:'她染血的指尖点向他的心口。',v:'金色符纹沿衣襟扩散，黑气骤然退缩。'},
{d:8,c:'scene-curse',sp:'周时阅',t:'本王的命？',s:'他第一次真正正眼看她。',v:'杀气与紫气同时充满狭窄车厢。'},
{d:9,c:'scene-rebirth',sp:'陆昭菱',t:'我要留在你身边，半年。',s:'她需要他的紫气养命，他需要她压住死劫。',v:'一场各取所需的交易，在雨夜开始。'},
{d:8,c:'scene-final',sp:'朱明浩',t:'人是本世子的——',s:'车帘被猛地掀开。',v:'暖色灯火照进车厢，空气骤然凝固。'},
{d:10,c:'scene-final',sp:'周时阅',t:'你的人？……再说一遍。',s:'第一集 · 完',v:'男人只抬了一次眼，来人脸色瞬间惨白。'}
];
const stage=document.getElementById('stage'),play=document.getElementById('play'),restart=document.getElementById('restart'),speaker=document.getElementById('speaker'),line=document.getElementById('line'),sub=document.getElementById('sub'),fill=document.getElementById('fill'),time=document.getElementById('time'),flash=document.getElementById('flash');
const total=scenes.reduce((a,b)=>a+b.d,0);let running=false,startAt=0,elapsed=0,raf,idx=-1;
function say(text,sp){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[—…]/g,''));u.lang='zh-CN';u.rate=sp==='周时阅'?.78:.9;u.pitch=sp==='周时阅'?.72:1.06;u.volume=.92;speechSynthesis.speak(u)}
function setScene(i){if(i===idx)return;idx=i;const x=scenes[i];stage.className='stage '+x.c;speaker.textContent=x.sp;line.textContent=x.t;sub.textContent=x.s;flash.animate([{opacity:.6},{opacity:0}],{duration:330});say(x.t,x.sp)}
function sceneAt(t){let acc=0;for(let i=0;i<scenes.length;i++){if(t<acc+scenes[i].d)return i;acc+=scenes[i].d}return scenes.length-1}
function tick(ts){if(!running)return;if(!startAt)startAt=ts-elapsed*1000;elapsed=(ts-startAt)/1000;if(elapsed>=total){elapsed=total;running=false;play.textContent='▶ 再看一遍';speechSynthesis.cancel()}setScene(sceneAt(Math.min(elapsed,total-.001)));fill.style.width=(elapsed/total*100)+'%';time.textContent='00:'+String(Math.floor(elapsed)).padStart(2,'0');if(running)raf=requestAnimationFrame(tick)}
function start(){if(elapsed>=total){elapsed=0;idx=-1}running=!running;if(running){startAt=performance.now()-elapsed*1000;play.textContent='❚❚ 暂停';raf=requestAnimationFrame(tick)}else{cancelAnimationFrame(raf);speechSynthesis.cancel();play.textContent='▶ 继续'}}
play.onclick=start;restart.onclick=()=>{running=false;cancelAnimationFrame(raf);speechSynthesis.cancel();elapsed=0;startAt=0;idx=-1;fill.style.width='0';time.textContent='00:00';play.textContent='▶ 播放第一集';stage.className='stage';speaker.textContent='点击播放';line.textContent='第一集 · 助我重生';sub.textContent='网页自动剪辑版 · 无需手动切镜头'};
</script>
